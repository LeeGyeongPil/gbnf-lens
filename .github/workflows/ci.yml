# Offline tests: build, node:test cases (37), recorded llama.cpp parity.
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # every Monday: catch breakage from dependency or runtime changes
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build --if-present
